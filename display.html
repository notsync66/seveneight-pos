<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>💧 Seven Eight — Display</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--card:#161b22;--border:#30363d;
  --accent:#58a6ff;--green:#3fb950;--muted:#8b949e;--text:#e6edf3;
}
html,body{
  width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Sarabun',sans-serif;overflow:hidden;
}
#idle{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100dvh;gap:16px;padding:24px;text-align:center;
}
.idle-logo{font-size:72px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.idle-brand{font-size:32px;font-weight:800;letter-spacing:1px}
.idle-sub{font-size:16px;color:var(--muted);margin-top:4px}
.idle-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-top:24px;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

#payDisplay{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100dvh;padding:24px;
  background:radial-gradient(ellipse at top, #0f2030 0%, var(--bg) 70%);
}
.pay-label{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.pay-amount{font-size:clamp(52px,14vw,96px);font-weight:800;color:var(--green);line-height:1;margin-bottom:20px}
.qr-wrap{
  background:#fff;border-radius:20px;padding:14px;
  box-shadow:0 8px 40px rgba(0,200,100,.15);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
#qrCanvas{width:min(240px,55vw);height:min(240px,55vw)}
.lock-badge{
  display:flex;align-items:center;gap:8px;
  background:#1a3a1a;border:1.5px solid var(--green);
  border-radius:14px;padding:10px 22px;margin-bottom:14px;
}
.lock-badge span{font-size:14px;color:var(--green);font-weight:700}
.scan-hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.7}

#doneDisplay{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100dvh;padding:24px;gap:12px;text-align:center;
}
.done-icon{font-size:80px;animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.done-title{font-size:28px;font-weight:800;color:var(--green)}
.done-sub{font-size:16px;color:var(--muted)}

#connDot{
  position:fixed;top:12px;right:14px;width:10px;height:10px;
  border-radius:50%;background:var(--muted);transition:background .4s;z-index:99
}
#connDot.ok{background:var(--green)}
#connDot.err{background:#f85149}
</style>
</head>
<body>

<div id="connDot"></div>

<div id="idle">
  <div class="idle-logo">&#x1F4A7;</div>
  <div class="idle-brand">Seven Eight</div>
  <div class="idle-sub">รอรับออร์เดอร์...</div>
  <div class="idle-dot"></div>
</div>

<div id="payDisplay">
  <div class="pay-label">ยอดที่ต้องชำระ</div>
  <div class="pay-amount" id="dispAmount">0&#x0E3F;</div>
  <div class="qr-wrap">
    <div id="qrCanvas"></div>
  </div>
  <div class="lock-badge">
    <span>&#x1F512; QR ล็อคยอด — สแกนได้เลยครับ</span>
  </div>
  <div class="scan-hint">สแกน QR พร้อมเพย์เพื่อชำระเงิน<br>ยอดถูกล็อคอัตโนมัติ ไม่ต้องพิมพ์เพิ่ม</div>
</div>

<div id="doneDisplay">
  <div class="done-icon">&#x2705;</div>
  <div class="done-title">ขอบคุณครับ!</div>
  <div class="done-sub">กลับมาอีกนะครับ &#x1F60A;</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCtlocEaaaAD8TIMFjFEQ3OtrhqI0-S1pps",
    authDomain: "seveneight-pos.firebaseapp.com",
    databaseURL: "https://seveneight-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "seveneight-pos",
    storageBucket: "seveneight-pos.firebasestorage.app",
    messagingSenderId: "826689738915",
    appId: "1:826689738915:web:bc171bde394b3468570716"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dot = document.getElementById('connDot');
  const idle = document.getElementById('idle');
  const payDisplay = document.getElementById('payDisplay');
  const doneDisplay = document.getElementById('doneDisplay');
  const dispAmount = document.getElementById('dispAmount');
  const qrCanvas = document.getElementById('qrCanvas');

  let lastTs = null;
  let doneTimer = null;

  function showIdle(){
    idle.style.display = 'flex';
    payDisplay.style.display = 'none';
    doneDisplay.style.display = 'none';
  }

  function showPay(amount, payload){
    idle.style.display = 'none';
    doneDisplay.style.display = 'none';
    payDisplay.style.display = 'flex';
    dispAmount.textContent = Number(amount).toLocaleString() + '\u0E3F';
    qrCanvas.innerHTML = '';
    const size = Math.min(240, Math.round(window.innerWidth * 0.55));
    try {
      new QRCode(qrCanvas, {
        text: payload,
        width: size, height: size,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(e){ console.error('QRCode error', e); }
  }

  function showDone(){
    idle.style.display = 'none';
    payDisplay.style.display = 'none';
    doneDisplay.style.display = 'flex';
    if(doneTimer) clearTimeout(doneTimer);
    doneTimer = setTimeout(showIdle, 3000);
  }

  onValue(ref(db, 'display'), (snap) => {
    dot.className = 'ok';
    const data = snap.val();
    if(!data){
      if(lastTs !== null){ showDone(); }
      lastTs = null;
      return;
    }
    if(data.ts !== lastTs){
      lastTs = data.ts;
      if(doneTimer){ clearTimeout(doneTimer); doneTimer = null; }
      showPay(data.amount, data.payload);
    }
  }, (err) => {
    dot.className = 'err';
    console.error(err);
  });

  // Wake Lock — ไม่ให้จอดับ
  async function keepAwake(){
    if('wakeLock' in navigator){
      try{ await navigator.wakeLock.request('screen'); }catch(e){}
    }
  }
  keepAwake();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') keepAwake();
  });
</script>
</body>
</html>
